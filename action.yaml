name: Trunk Analytics Uploader
author: trunk.io
description: Uploads test results to trunk.io

inputs:
  junit-paths:
    description: Comma-separated list of glob paths to junit files.
    required: false
  org-slug:
    description: Organization slug.
    required: true
  token:
    description: A Trunk v2 API key (trunk_v2_...) with the Upload test results permission, from Settings → Developer → API Keys in the Trunk app. Stored with `trunk auth api-key set` for this step only; never put on a command line. The action does not read the TRUNK_API_TOKEN env var.
    required: false
  allow-forked-pr-uploads:
    description: Upload from a forked pull request, which cannot read repository secrets and so has no token. Uses the job's GitHub token; the collection must have forked-PR uploads enabled in Trunk.
    required: false
    default: false
    type: boolean
  repo-head-branch:
    description: Value to override branch of repository head.
    required: false
  run:
    description: The command to run before uploading test results, run by `/bin/sh -c` (`cmd.exe /c` on Windows). Needs a v2 API key as token.
    required: false
  repo-root:
    description: The root directory of the repository.
    required: false
  cli-version:
    description: The version of trunk-analytics-cli the trunk CLI runs. `latest` resolves to the newest 1.x release from trunk.io/releases/analytics-cli/prod/channel-1.json. This version of the action needs 1.x.
    required: false
    default: latest
  trunk-cli-version:
    description: The version of the trunk CLI to install from trunk.io/releases/trunk-cli. `latest` resolves to the newest release on the prod channel. Needs 0.0.14 or later.
    required: false
    default: latest
  xcresult-path:
    description: Path to the xcresult directory.
    required: false
  bazel-bep-path:
    description: Path to the bazel BEP file to parse in place of junits.
    required: false
  swift-test-xunit-paths:
    description: Comma-separated list of glob paths to junit files written by `swift test --xunit-output`, whose tests are attributed to the file each is declared in. Defaults to TRUNK_SWIFT_TEST_XUNIT_PATHS env var.
    required: false
  use-bazel-target-for-codeowners:
    description: Use the Bazel target label as a fallback path for CODEOWNERS association when no file attribute is present in the JUnit XML.
    required: false
    default: false
    type: boolean
  quarantine:
    description: Set to false to turn quarantining off for this upload, so every failing test fails the step. Leave it unset (or true) to quarantine as configured in Trunk.
    required: false
  allow-missing-junit-files:
    description: Whether or not to allow missing junit files in the upload invocation.
    required: false
    default: true
  variant:
    description: User specified variant of a set of tests being uploaded. Not usually necessary; set it only when the same tests run in different environments and should be tracked separately.
    required: false
  test-collection-id:
    description: 8 character alphanumeric ID of the test collection to upload to, shown on the collection's page in Trunk.
    required: true
  verbose:
    description: Enable verbose logging
    default: false
    required: false
    type: boolean
  summary-output-file:
    description: Path to write the CLI's JSON summary of the run to, such as for a PR comment. Defaults to a file in the job's temp directory; the `summary-output-file` output gives the path either way.
    required: false
  use-uncloned-repo:
    description: Set to 'true' if your tests do not require cloning the repository under test,
    required: false
    default: false
    type: boolean
  previous-step-outcome:
    description: The outcome of the previous step in the workflow. Set this equal to steps.[id].outcome where `[id]` is the id of the corresponding test run.
    required: false
  # these are automatically grabbed inputs
  # it is recommended to leave these as is and not specify them when running this action
  github-token:
    description: The job's GitHub token, exported to the CLI as GITHUB_TOKEN. The CLI sends it to Trunk only on a pull request from a fork, with allow-forked-pr-uploads and no token, to log the upload in.
    default: ${{ github.token }}
  pr-title:
    description: The Title of the Pull Request (if being run inside one)
    default: ${{ github.event.pull_request.title }}
  gh-repo-url:
    description: The URL of the GitHub repo. The base repo, so a fork PR's tests keep the upstream repo's identity.
    default: ${{ github.event.pull_request.base.repo.html_url }}
  gh-fork-repo-url:
    description: The URL of the fork the pull request head lives in, empty unless the head repo differs from the base repo. Exported to the CLI as TRUNK_FORK_REPO_URL.
    default: ${{ github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name && github.event.pull_request.head.repo.html_url || '' }}
  gh-repo-head-sha:
    description: The head commit of the pull request
    default: ${{ github.event.pull_request.head.sha }}
  gh-repo-head-branch:
    description: The head branch of the pull request
    default: ${{ github.event.pull_request.head.ref }}
  gh-repo-head-commit-epoch:
    description: The commit timestamp
    default: ${{ github.event.pull_request.updated_at }}
  gh-repo-head-author-name:
    description: The actor triggering the action
    default: ${{ github.actor }}
  show-failure-messages:
    description: Show failure outputs in upload. This is experimental, do not rely on this.
    type: boolean
    default: false
  dry-run:
    description: Run without uploading the results to the server. They will instead be dumped to the directory that the action is run in.
    type: boolean
    default: false
    required: false
  use-cache:
    description: Cache the trunk CLI and trunk-analytics-cli binaries to reduce subsequent downloads. Set to false to download them on every run.
    type: boolean
    default: true
    required: false

outputs:
  summary-output-file:
    description: Path to the CLI's JSON summary of the run. Set only when the CLI wrote one.

runs:
  using: node24
  main: dist/index.js
